<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Tankside legal pages: the privacy policy for the Android aquarium water-test log, in five languages">
<title>Tankside: legal pages</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1c30"/><stop offset=".5" stop-color="#1b2a4a"/><stop offset="1" stop-color="#14408a"/></linearGradient>
<radialGradient id="g1" cx=".06" cy="0" r=".6"><stop offset="0" stop-color="#40cec4" stop-opacity=".32"/><stop offset="1" stop-color="#40cec4" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="1" cy="1" r=".65"><stop offset="0" stop-color="#1a73e8" stop-opacity=".65"/><stop offset="1" stop-color="#1a73e8" stop-opacity="0"/></radialGradient>
