<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".14"/></linearGradient>
<linearGradient id="wv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#40cec4" stop-opacity=".22"/><stop offset="1" stop-color="#40cec4" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
<clipPath id="tube"><path d="M850 104 H882 V170 a16 16 0 0 1 -32 0 Z"/></clipPath>
<clipPath id="pc"><rect x="822" y="62" width="410" height="256" rx="20"/></clipPath>
<mask id="tm"><text x="84" y="196" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-2.5" fill="#fff">Tankside</text></mask>
</defs>
<style>
.ring{animation:ring 10s cubic-bezier(.65,0,.25,1) infinite}
@keyframes ring{0%,16%{transform:translateX(0.0px)}20%,36%{transform:translateX(-124.0px)}40%,56%{transform:translateX(62.0px)}60%,76%{transform:translateX(-62.0px)}80%,96%{transform:translateX(124.0px)}100%{transform:translateX(0px)}}
.liq{animation:liq 10s ease-in-out infinite}
@keyframes liq{0%,16%{fill:#46a27c}20%,36%{fill:#c4bd3c}40%,56%{fill:#2c7eaa}60%,76%{fill:#8fb24c}80%,96%{fill:#3d4f9f}100%{fill:#46a27c}}
.vv{opacity:0;animation:vv 10s linear infinite}
@keyframes vv{0%{opacity:0;transform:translateY(8px)}3%,16%{opacity:1;transform:none}19%,100%{opacity:0;transform:translateY(-8px)}}
.tap{opacity:0;animation:tap 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tap{0%,40%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(.8)}80%,100%{opacity:0;transform:scale(1.5)}}
.bb{animation:bb 2.5s ease-in infinite;opacity:0}
@keyframes bb{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-70px)}}
.fb{animation:fb 8s linear infinite;opacity:0}
@keyframes fb{0%{opacity:0;transform:translateY(0)}10%{opacity:1}90%{opacity:.6}100%{opacity:0;transform:translateY(-400px)}}
.wave{animation:wave 9s linear infinite}
@keyframes wave{to{transform:translateX(-160px)}}
.rv{opacity:0;animation:rv .9s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.shine{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-300px)}50%,100%{transform:translateX(720px)}}
.drift{animation:dr 10s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(36px,12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv{opacity:1}.vv{opacity:0}.v0{opacity:1}}
</style>
